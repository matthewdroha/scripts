[project]
name = "prep-tech"
version = "0.1.0"
description = "Prepare Cheetah process technology list files for ctech and synthesis."
readme = "README.md"
authors = [
    { name = "matthewdroha", email = "matthew.d.roha@intel.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
prep_tech = "prep_tech:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
