[project]
name = "find-collisions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "matthewdroha", email = "matthew.d.roha@intel.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "zstandard>=0.25.0",
]

[project.scripts]
find-collisions = "find_collisions:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
